name: CI - offline contract lab
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q wizard_lab.py batch_run.py check_ollama.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Mock smoke test
        run: |
          python wizard_lab.py --mode mock --mock-kind reject --rounds 2
          python batch_run.py --mode mock --rounds 2
